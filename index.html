<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* Dark navy, similar to Anduril */
            color: #e2e8f0; /* Light gray text */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 60px 20px;
            background-color: #1e293b;
        }
        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin: 0;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
        }
        .photo-card {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        .photo-card:hover {
            transform: scale(1.05);
        }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.8));
            padding: 40px 20px 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 300;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #1e293b;
            font-size: 0.9rem;
        }
        @media (max-width: 1024px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Photo Gallery</h1>
    </header>

    <section class="gallery">
        <div class="photo-card">
            <img src="https://thumbs.dreamstime.com/b/tulsa-oklahoma-usa-downtown-city-skyline-afternoon-138286439.jpg" alt="Tulsa, OK Skyline">
            <div class="caption">Tulsa, Oklahoma</div>
        </div>

        <div class="photo-card">
            <img src="https://images.pexels.com/photos/460621/pexels-photo-460621.jpeg" alt="Serene Nature Waterfall">
            <div class="caption">Nature's Serenity</div>
        </div>

        <div class="photo-card">
            <img src="https://www.shutterstock.com/image-photo/portrait-handsome-young-gen-z-260nw-2453673529.jpg" alt="Random Portrait">
            <div class="caption">Just a Guy</div>
        </div>
    </section>

    <footer>
        &copy; 2025 My GitHub Pages Site
    </footer>
</body>
</html>
